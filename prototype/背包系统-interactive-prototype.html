    <div class="equipment-actions hidden" id="equipmentActions">
      <button class="secondary-btn">重塑</button>
      <button class="secondary-btn">锻造</button>
    </div>

    <section class="modal-layer" id="modalLayer" aria-live="polite">
      <div class="modal" id="modalBox"></div>
    </section>
  </main>
</div>

<script>
const items = [
  { id: "token", tab: "items", name: "水淹七军 战法信物", count: 1, timed: true, choice: true, action: "use", owner: "当前拥有：1", copy: "获得的重复武将将转化成信物，可用于对应武将的升阶。", routes: ["招募", "战法演练", "商店兑换"] },
  { id: "chest", tab: "items", name: "自选资源宝箱", count: 6, timed: false, choice: true, action: "use", owner: "当前拥有：6", copy: "打开后可在多类基础资源中选择一种获得。", routes: ["主线任务", "活动奖励", "同盟商店"] },
  { id: "speed", tab: "items", name: "行军加速令", count: 12, timed: true, choice: false, action: "use", owner: "当前拥有：12", copy: "使用后减少当前行军队列的剩余时间。", routes: ["每日任务", "战功商店"] },
  { id: "iron", tab: "materials", name: "精铁", count: 248, timed: false, choice: false, action: "route", owner: "当前拥有：248", copy: "装备打造与重塑所需的基础材料。", routes: ["讨伐山贼", "资源商店", "装备分解"] },
  { id: "stone", tab: "materials", name: "玄纹石", count: 37, timed: false, choice: false, action: "route", owner: "当前拥有：37", copy: "用于高阶装备词条重塑的稀有材料。", routes: ["赛季奖励", "战役掉落"] },
  { id: "soul-caocao", tab: "souls", name: "曹操将魂", count: 80, timed: false, choice: false, action: "promote", owner: "当前拥有：80", copy: "武将进阶材料。当前数量满足下一阶段进阶。", routes: ["招募转化", "将星阁"] },
  { id: "soul-zhouyu", tab: "souls", name: "周瑜将魂", count: 36, timed: false, choice: false, action: "split", owner: "当前拥有：36", copy: "该武将已满阶，多余将魂可分解为英魄。", routes: ["招募转化", "将星阁"] }
];

const equipment = [
  { name: "赤黄飞电", selected: true, chips: ["万象", "万象"], state: "曹操" },
  { name: "抓黄飞电", selected: false, chips: ["万象"], state: "曹操" },
  { name: "赤黄飞电", selected: false, chips: ["万象", "万象"], state: "曹操" },
  { name: "抓黄飞电", selected: false, chips: ["万象"], state: "曹操" }
];

let currentTab = "items";
let selectedItemId = "token";
let quantity = 1;

const stage = document.querySelector(".stage");
const gridBoard = document.getElementById("gridBoard");
const detailName = document.getElementById("detailName");
const detailCopy = document.getElementById("detailCopy");
const detailOwner = document.getElementById("detailOwner");
const routes = document.getElementById("routes");
const detailAction = document.getElementById("detailAction");
const gridShell = document.getElementById("gridShell");
const equipmentShell = document.getElementById("equipmentShell");
const detailPanel = document.getElementById("detailPanel");
const quickActions = document.getElementById("quickActions");
const equipmentActions = document.getElementById("equipmentActions");
const modalLayer = document.getElementById("modalLayer");
const modalBox = document.getElementById("modalBox");
const capacity = document.getElementById("capacity");

function scaleStage() {
  const scale = Math.min(window.innerWidth / 2340, window.innerHeight / 1080);
  stage.style.transform = `scale(${scale})`;
}

function visibleItems() {
  return items.filter(item => item.tab === currentTab);
}

function renderGrid() {
  const pageItems = visibleItems();
  if (!pageItems.some(item => item.id === selectedItemId)) {
    selectedItemId = pageItems[0]?.id || selectedItemId;
  }
  gridBoard.innerHTML = "";
  const cells = 20;
  for (let index = 0; index < cells; index += 1) {
    const item = pageItems[index];
    const button = document.createElement("button");
    button.className = `slot ${item ? "has-item" : "empty-slot"} ${item?.id === selectedItemId ? "is-selected" : ""}`;
    button.dataset.nodeId = "6405:14820";
    button.dataset.componentKey = "9564eb243dfa5cb92cfb82891b25449e00f4df85";
    if (item) {
      button.dataset.itemId = item.id;
      button.innerHTML = `
        <img class="item-icon" src="assets/backpack-item-icon-token.png" alt="">
        ${item.timed ? '<img class="time" src="assets/backpack-time-badge.png" alt="">' : ""}
        ${item.choice ? '<span class="tag">自选</span>' : ""}
        <span class="count">${item.count}</span>
      `;
      button.addEventListener("click", () => {
        selectedItemId = item.id;
        renderGrid();
        renderDetail();
      });
    }
    gridBoard.appendChild(button);
  }
  capacity.textContent = `${pageItems.length}/300`;
}

function renderDetail() {
  const item = items.find(entry => entry.id === selectedItemId) || visibleItems()[0];
  if (!item) return;
  detailName.textContent = item.name;
  detailCopy.textContent = item.copy;
  detailOwner.textContent = item.owner;
  routes.innerHTML = item.routes.map(route => `<button class="route"><span>${route}</span><span>前往</span></button>`).join("");
  detailAction.textContent = item.action === "split" ? "分解" : item.action === "route" ? "前往" : "使用";
  detailAction.onclick = () => {
    if (item.action === "promote") openPromoteModal(item);
    else if (item.action === "split") openRewardsModal("分解结果");
    else if (item.action === "route") routes.querySelector(".route")?.focus();
    else openUseModal(item);
  };
}

function renderEquipment() {
  document.getElementById("equipmentList").innerHTML = equipment.map((entry, index) => `
    <button class="equipment-row ${entry.selected ? "is-selected" : ""}">
      <div class="eq-name">
        <span class="eq-slot" data-node-id="6405:14820" data-component-key="9564eb243dfa5cb92cfb82891b25449e00f4df85"><img src="assets/backpack-item-icon-token.png" alt=""></span>
        <span>${entry.name}</span>
      </div>
      <div class="stats">
        <div class="stat"><span>武力</span><span class="bar"><span></span></span><span>+8.1</span></div>
        <div class="stat"><span>先攻</span><span class="bar"><span></span></span><span>+8.1</span></div>
      </div>
      <div class="chips">${entry.chips.map(chip => `<span class="chip">${chip}</span>`).join("")}</div>
      <div class="hero-portrait" aria-label="${entry.state}"></div>
    </button>
  `).join("");
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".main-tab").forEach(btn => btn.classList.toggle("is-active", btn.dataset.tab === tab));
  const isEquipment = tab === "equipment";
  gridShell.classList.toggle("hidden", isEquipment);
  equipmentShell.classList.toggle("hidden", !isEquipment);
  detailPanel.classList.toggle("hidden", isEquipment);
  equipmentActions.classList.toggle("hidden", !isEquipment);
  document.getElementById("batchPromote").classList.toggle("hidden", tab !== "souls");
  document.getElementById("starShop").classList.toggle("hidden", tab !== "souls");
  stage.dataset.layoutNodeId = isEquipment ? "6405:15876" : "6386:13440";
  if (isEquipment) {
    capacity.textContent = "4/300";
  } else {
    renderGrid();
    renderDetail();
  }
}

function modalFrame(title, body, wide = false) {
  modalBox.className = `modal ${wide ? "is-wide" : ""}`;
  modalBox.innerHTML = `
    <div class="modal-title">${title}</div>
    <button class="modal-close" aria-label="关闭">×</button>
    ${body}
  `;
  modalBox.querySelector(".modal-close").addEventListener("click", closeModal);
  modalLayer.classList.add("is-open");
}

function closeModal() {
  modalLayer.classList.remove("is-open");
  modalBox.innerHTML = "";
}

function openUseModal(item) {
  quantity = 1;
  modalFrame("使用道具", `
    <div class="use-layout" data-component-name="UIBagUsePanel" data-node-id="4873:5530" data-component-key="3d5df0da3b62cf16a7004e7c1dbf398b9d910c33">
      <div class="big-item"><img src="assets/backpack-item-icon-token.png" alt=""></div>
      <div>
        <div class="modal-copy">${item.name}<br>${item.copy}</div>
        <div class="quantity">
          <button id="minusQty">−</button>
          <strong id="qtyValue">1</strong>
          <button id="plusQty">＋</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="secondary-btn" id="cancelUse">取消</button>
      <button class="primary-btn" id="confirmUse">确认</button>
    </div>
  `);
  document.getElementById("minusQty").onclick = () => setQuantity(Math.max(1, quantity - 1));
  document.getElementById("plusQty").onclick = () => setQuantity(Math.min(item.count, quantity + 1));
  document.getElementById("cancelUse").onclick = closeModal;
  document.getElementById("confirmUse").onclick = () => openRewardsModal("获得结果");
}

function setQuantity(value) {
  quantity = value;
  document.getElementById("qtyValue").textContent = String(quantity);
}

function openPromoteModal(item) {
  modalFrame("将魂进阶", `
    <div class="promote-card" data-component-name="UIHeroPromoteWindow" data-node-id="4873:5178" data-component-key="1a492106773d070a75495daf91b3a81136894148">
      <div class="hero-card-lite" data-component-name="武将列表" data-node-id="2040:3643" data-component-key="dce0d186fc56c45e056adbe4909ca7b3a5a27f98"><strong>曹操</strong></div>
      <div class="modal-copy">${item.name}<br>消耗 80 个将魂，提升目标武将进阶等级。进阶后解锁更高属性成长。</div>
    </div>
    <div class="modal-actions">
      <button class="secondary-btn" id="cancelPromote">取消</button>
      <button class="primary-btn" id="confirmPromote">进阶</button>
    </div>
  `);
  document.getElementById("cancelPromote").onclick = closeModal;
  document.getElementById("confirmPromote").onclick = () => openRewardsModal("进阶成功");
}

function openSplitModal() {
  modalFrame("批量分解", `
    <div class="split-layout" data-component-name="中弹窗空白模板" data-node-id="6617:13137" data-component-key="1872f05dddd3b7c2a81a7bf1493c44c4a19b1a96">
      <div class="split-list" data-component-name="勾选" data-node-id="6877:16542" data-component-key="746aff6bc4e32884f8ebcb8d615df8cf5b421dd0">
        <div class="split-row"><span class="checkbox"></span><span>周瑜将魂</span><span>×36</span></div>
        <div class="split-row"><span class="checkbox"></span><span>孙权将魂</span><span>×42</span></div>
        <div class="split-row"><span class="checkbox"></span><span>甘宁将魂</span><span>×18</span></div>
      </div>
      <div class="modal-copy">预计获得<br><strong>英魄 × 960</strong><br>英魂符 × 12</div>
    </div>
    <div class="modal-actions">
      <button class="secondary-btn" id="cancelSplit">取消</button>
      <button class="primary-btn" id="confirmSplit">分解</button>
    </div>
  `, true);
  document.getElementById("cancelSplit").onclick = closeModal;
  document.getElementById("confirmSplit").onclick = () => openRewardsModal("获得结果");
}

function openRewardsModal(title) {
  modalFrame(title, `
    <div data-component-name="UIRewardsPreviewPopUp" data-node-id="4909:15972" data-component-key="8d1890e7368519548068920225efa04e07ca8d37">
      <div class="reward-grid">
        <div class="slot has-item"><img class="item-icon" src="assets/backpack-item-icon-token.png" alt=""><span class="count">960</span></div>
        <div class="slot has-item"><img class="item-icon" src="assets/backpack-item-icon-token.png" alt=""><span class="count">12</span></div>
        <div class="slot has-item"><img class="item-icon" src="assets/backpack-item-icon-token.png" alt=""><span class="count">1</span></div>
      </div>
      <div class="modal-actions"><button class="primary-btn" id="closeRewards">确认</button></div>
    </div>
  `);
  document.getElementById("closeRewards").onclick = closeModal;
}

document.querySelectorAll(".main-tab").forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));
document.getElementById("oneClickSplit").addEventListener("click", openSplitModal);
document.getElementById("batchPromote").addEventListener("click", () => openPromoteModal(items.find(item => item.id === "soul-caocao")));
document.getElementById("starShop").addEventListener("click", () => routes.querySelector(".route")?.focus());
modalLayer.addEventListener("click", event => {
  if (event.target === modalLayer) closeModal();
});
window.addEventListener("resize", scaleStage);

scaleStage();
renderEquipment();
switchTab("items");
</script>
</body>
</html>
